services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: agendapro
      POSTGRES_USER: agendapro
      POSTGRES_PASSWORD: agendapro
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agendapro"]
      interval: 5s
      timeout: 5s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+psycopg://agendapro:agendapro@db:5432/agendapro
      SECRET_KEY: ${SECRET_KEY:-replace-this-before-production}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-480}
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
    ports: ["8000:8000"]
    depends_on:
      db:
        condition: service_healthy
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports: ["3000:80"]
    depends_on: [backend]
volumes:
  postgres_data:
