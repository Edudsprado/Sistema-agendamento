name: Runtime Verification

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      POSTGRES_DB: agendapro
      POSTGRES_USER: agendapro
      POSTGRES_PASSWORD: ci_postgres_password
      DATABASE_URL: postgresql+psycopg://agendapro:ci_postgres_password@db:5432/agendapro
      SECRET_KEY: ci-secret-key-for-runtime-verification-only
      ACCESS_TOKEN_EXPIRE_MINUTES: "60"
      CORS_ORIGINS: http://localhost:3000,http://localhost:5173
      VITE_API_URL: http://localhost:8000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        working-directory: backend
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run backend test suite
        working-directory: backend
        run: pytest -q

      - name: Start application with Docker Compose
        run: docker compose up --build -d

      - name: Wait for backend healthcheck
        run: |
          for i in {1..60}; do
            if curl -fsS http://localhost:8000/api/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs --no-color backend
          exit 1

      - name: Verify frontend is serving
        run: curl -fsS http://localhost:3000/ >/dev/null

      - name: Run runtime authentication smoke tests
        run: |
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          BASE = "http://localhost:8000"

          def call(method, path, payload=None, token=None):
              data = None if payload is None else json.dumps(payload).encode()
              headers = {"Content-Type": "application/json"}
              if token:
                  headers["Authorization"] = f"Bearer {token}"
              request = urllib.request.Request(
                  f"{BASE}{path}",
                  data=data,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(request, timeout=10) as response:
                      raw = response.read().decode()
                      body = json.loads(raw) if raw else None
                      return response.status, body
              except urllib.error.HTTPError as exc:
                  raw = exc.read().decode()
                  try:
                      body = json.loads(raw) if raw else None
                  except json.JSONDecodeError:
                      body = raw
                  return exc.code, body

          email = f"ci-{int(time.time())}@example.com"
          password = "Senha123!"

          status, data = call("POST", "/api/auth/register", {
              "name": "CI User",
              "email": email,
              "password": password,
          })
          assert status == 201, ("register", status, data)
          token = data["access_token"]

          status, data = call("GET", "/api/auth/me", token=token)
          assert status == 200 and data["email"] == email, ("me", status, data)

          status, data = call("GET", "/api/dashboard", token=token)
          assert status == 200, ("dashboard", status, data)

          status, data = call("GET", "/api/dashboard")
          assert status in (401, 403), ("dashboard without token", status, data)

          status, data = call("GET", "/api/auth/me", token="invalid-token")
          assert status == 401, ("invalid token", status, data)

          oversized_password = "a" * 129
          status, data = call("POST", "/api/auth/login", {
              "email": email,
              "password": oversized_password,
          })
          assert status == 422, ("oversized password", status, data)

          statuses = []
          for _ in range(6):
              status, _ = call("POST", "/api/auth/login", {
                  "email": email,
                  "password": "senha-errada",
              })
              statuses.append(status)
          assert statuses[:5] == [401, 401, 401, 401, 401], statuses
          assert statuses[5] == 429, statuses

          status, data = call("POST", "/api/auth/logout", token=token)
          assert status == 204, ("logout", status, data)

          status, data = call("GET", "/api/auth/me", token=token)
          assert status == 401, ("revoked token", status, data)
          PY

      - name: Show Docker logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Stop containers
        if: always()
        run: docker compose down -v
